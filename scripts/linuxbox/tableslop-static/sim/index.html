<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla Primavera — Island Sim · tableslop</title>
<style>
  :root {
    --bg: #0a0714;
    --bg2: #140a26;
    --panel: rgba(22, 12, 44, 0.82);
    --edge: #3b2a6b;
    --cyan: #01cdfe;
    --pink: #ff71ce;
    --purple: #b967ff;
    --yellow: #fffb96;
    --green: #05ffa1;
    --red: #ff2a6d;
    --ink: #d8d4f2;
    --dim: #8d86b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(rgba(10, 7, 20, 0.55) 1px, transparent 1px) 0 0 / 100% 3px,
      radial-gradient(1200px 500px at 50% -10%, rgba(185, 103, 255, 0.20), transparent 60%),
      radial-gradient(900px 420px at 85% 0%, rgba(1, 205, 254, 0.12), transparent 55%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 45%);
    color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    min-height: 100vh;
  }
  .hud-brand {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--edge);
  }
  .hud-brand .brand {
    font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(180deg, var(--yellow) 0%, var(--pink) 55%, var(--purple) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud-brand .sub { color: var(--cyan); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }
  .hud-brand .clock { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; }
  .hud-brand .clock b { color: var(--yellow); font-weight: 700; }

  main { padding: 14px 18px 28px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(1, 205, 254, 0.06), 0 6px 24px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .panel > h2 {
    margin: 0; padding: 9px 12px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--cyan); border-bottom: 1px solid var(--edge);
    background: linear-gradient(90deg, rgba(1, 205, 254, 0.10), transparent 70%);
  }
  .panel .body { padding: 10px 12px 12px; }

  table.mkt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mkt th {
    text-align: left; color: var(--dim); font-weight: 400; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase; padding: 4px 6px;
    border-bottom: 1px dashed var(--edge);
  }
  table.mkt td { padding: 5px 6px; border-bottom: 1px solid rgba(59, 42, 107, 0.45); }
  table.mkt tr:last-child td { border-bottom: 0; }
  table.mkt td.price { color: var(--ink); text-align: right; font-weight: 700; }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--red); }
  .delta.flat { color: var(--dim); }
  .spark { display: block; }

  .heat-row { display: grid; grid-template-columns: 130px 1fr 74px; gap: 8px; align-items: center; padding: 7px 0; }
  .heat-row + .heat-row { border-top: 1px solid rgba(59, 42, 107, 0.45); }
  .heat-row .city { font-size: 13px; }
  .heatbar { position: relative; height: 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; }
  .heatbar .fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple) 55%, var(--pink) 80%, var(--red)); }
  .heatbar .thresh { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--yellow); opacity: 0.8; left: 50%; }
  .heat-row .val { font-size: 12px; color: var(--dim); text-align: right; }
  .chip {
    display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 10px; line-height: 16px;
    letter-spacing: 1px; border-radius: 3px; text-transform: uppercase; vertical-align: 1px;
  }
  .chip.surge { color: #fff; background: var(--red); box-shadow: 0 0 10px rgba(255, 42, 109, 0.7); }
  .chip.elev { color: #1a1430; background: var(--yellow); }

  .tension-row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 8px; align-items: center; padding: 6px 0; font-size: 12px; }
  .tension-row + .tension-row { border-top: 1px solid rgba(59, 42, 107, 0.45); }
  .tension-row .pair { color: var(--ink); }
  .tension-row .bar { height: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; }
  .tension-row .bar .fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); }
  .tension-row .val { color: var(--dim); text-align: right; font-size: 11px; }

  .blot { padding: 9px 0; border-top: 1px solid rgba(59, 42, 107, 0.45); }
  .blot:first-child { border-top: 0; padding-top: 2px; }
  .blot .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; margin-bottom: 3px; }
  .blot .day { color: var(--yellow); }
  .blot .kind { color: #1a1430; background: var(--cyan); border-radius: 3px; padding: 0 6px; letter-spacing: 1px; text-transform: uppercase; font-size: 10px; line-height: 16px; }
  .blot .where { color: var(--pink); }
  .blot .who { color: var(--dim); }
  .blot .cas { color: var(--red); }
  .blot .gm { color: #1a1430; background: var(--green); border-radius: 3px; padding: 0 5px; font-size: 10px; line-height: 16px; letter-spacing: 1px; }
  .blot .line { font-size: 13px; color: var(--ink); line-height: 1.45; }

  .empty { padding: 26px 16px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7; }
  .empty code { color: var(--yellow); }
  footer { padding: 10px 18px 22px; color: var(--dim); font-size: 11px; max-width: 1280px; margin: 0 auto; }
  footer b { color: var(--cyan); font-weight: 400; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .heat-row { grid-template-columns: 104px 1fr 62px; }
    .hud-brand .clock { width: 100%; text-align: left; margin-left: 0; }
  }
</style>
</head>
<body>
  <header class="hud-brand">
    <span class="brand">tableslop</span>
    <span class="sub">Isla Primavera // Island Sim</span>
    <span class="clock" id="clock">loading…</span>
  </header>
  <main>
    <div class="grid">
      <div class="col" id="markets"></div>
      <div class="col">
        <section class="panel" id="heatPanel">
          <h2>Heat — CRT attention</h2>
          <div class="body" id="heat"></div>
        </section>
        <section class="panel">
          <h2>Faction tensions</h2>
          <div class="body" id="tensions"></div>
        </section>
      </div>
    </div>
    <section class="panel" style="margin-top:14px">
      <h2>Police blotter — recent incidents</h2>
      <div class="body" id="blotter"></div>
    </section>
  </main>
  <footer id="foot"></footer>
  <script src="sim.js"></script>
</body>
</html>
