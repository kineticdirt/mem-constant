<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Primavera Radio — Isla Primavera</title>
<link rel="stylesheet" href="./radio.css"/>
</head>
<body>
<header class="hud">
  <div class="hud-brand">PRIMAVERA RADIO</div>
  <div class="hud-sub">ISLA PRIMAVERA &middot; FM DIAL 88&ndash;108</div>
  <a class="hud-link" href="/">&larr; MAP</a>
</header>

<main class="deck">
  <section class="dial" id="dial" aria-label="Station dial"></section>

  <section class="panel">
    <div class="now">
      <div class="freq"><span id="freq">--.-</span><span class="freq-unit">FM</span></div>
      <div class="now-meta">
        <div class="call" id="call">NO SIGNAL</div>
        <div class="cityline" id="cityline"></div>
        <p class="theme" id="theme"></p>
        <div class="host" id="host"></div>
      </div>
      <div class="transport">
        <button id="playBtn" class="play" type="button">PLAY</button>
        <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume"/>
        <div class="status" id="status">select a station</div>
      </div>
    </div>

    <div class="sheet">
      <div class="sheet-head">TONIGHT&rsquo;S SHEET <span id="sheetDate"></span></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
      <ul class="sheet-list" id="sheetList"></ul>
    </div>
  </section>
</main>

<audio id="player" preload="none"></audio>
<script src="./radio.js"></script>
</body>
</html>
