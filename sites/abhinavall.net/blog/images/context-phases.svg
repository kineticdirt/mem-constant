<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Context phases diagram">
  <rect width="720" height="320" fill="#0a0a0a"/>
  <text x="24" y="30" fill="#f5c518" font-family="monospace" font-size="12">// context budget by phase</text>
  <text x="24" y="58" fill="#9a9a9a" font-family="monospace" font-size="10">total window (e.g. 128k) - never fill it "just because"</text>
  <rect x="24" y="78" width="672" height="28" fill="none" stroke="#333"/>
  <rect x="24" y="78" width="134" height="28" fill="#ff2d2d" opacity="0.35"/>
  <rect x="158" y="78" width="201" height="28" fill="#00e5ff" opacity="0.35"/>
  <rect x="359" y="78" width="168" height="28" fill="#f5c518" opacity="0.35"/>
  <rect x="527" y="78" width="169" height="28" fill="#7fff00" opacity="0.35"/>
  <text x="32" y="96" fill="#fff" font-family="monospace" font-size="9">system</text>
  <text x="170" y="96" fill="#fff" font-family="monospace" font-size="9">research</text>
  <text x="370" y="96" fill="#fff" font-family="monospace" font-size="9">edit</text>
  <text x="538" y="96" fill="#fff" font-family="monospace" font-size="9">verify</text>
  <rect x="24" y="130" width="150" height="70" fill="none" stroke="#ff2d2d"/>
  <text x="36" y="152" fill="#ff2d2d" font-family="monospace" font-size="10">Phase 1: research</text>
  <text x="36" y="168" fill="#9a9a9a" font-family="monospace" font-size="9">tools: search, read</text>
  <text x="36" y="182" fill="#9a9a9a" font-family="monospace" font-size="9">~8-15k tokens in</text>
  <rect x="190" y="130" width="150" height="70" fill="none" stroke="#f5c518"/>
  <text x="202" y="152" fill="#f5c518" font-family="monospace" font-size="10">Phase 2: plan</text>
  <text x="202" y="168" fill="#9a9a9a" font-family="monospace" font-size="9">compress prior</text>
  <text x="202" y="182" fill="#9a9a9a" font-family="monospace" font-size="9">outline only</text>
  <rect x="356" y="130" width="150" height="70" fill="none" stroke="#00e5ff"/>
  <text x="368" y="152" fill="#00e5ff" font-family="monospace" font-size="10">Phase 3: execute</text>
  <text x="368" y="168" fill="#9a9a9a" font-family="monospace" font-size="9">narrow tool set</text>
  <text x="368" y="182" fill="#9a9a9a" font-family="monospace" font-size="9">diffs + schemas</text>
  <rect x="522" y="130" width="174" height="70" fill="none" stroke="#7fff00"/>
  <text x="534" y="152" fill="#7fff00" font-family="monospace" font-size="10">Phase 4: verify</text>
  <text x="534" y="168" fill="#9a9a9a" font-family="monospace" font-size="9">tests, linters</text>
  <text x="534" y="182" fill="#9a9a9a" font-family="monospace" font-size="9">fresh context</text>
  <path d="M99 200v24 M265 200v24 M431 200v24 M609 200v24" stroke="#444"/>
  <text x="24" y="248" fill="#9a9a9a" font-family="monospace" font-size="10">swap phases -&gt; unmount tools -&gt; summarize history -&gt; mount next subgraph</text>
  <rect x="24" y="262" width="672" height="40" fill="none" stroke="#333" stroke-dasharray="4 3"/>
  <text x="36" y="286" fill="#ff2d2d" font-family="monospace" font-size="10">anti-pattern: dump entire repo + all chat + all tool logs into one prompt</text>
</svg>
