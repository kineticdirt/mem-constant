<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="MCP agent stack diagram">
  <rect width="720" height="300" fill="#0a0a0a"/>
  <text x="24" y="32" fill="#f5c518" font-family="monospace" font-size="12">// agent + MCP (conceptual)</text>
  <rect x="24" y="52" width="150" height="56" fill="none" stroke="#ff2d2d" stroke-width="2"/>
  <text x="36" y="76" fill="#fff" font-family="monospace" font-size="11">Host app</text>
  <text x="36" y="94" fill="#9a9a9a" font-family="monospace" font-size="10">IDE / orchestrator</text>
  <path d="M174 80h36" stroke="#00e5ff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="210" y="52" width="150" height="56" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <text x="222" y="76" fill="#fff" font-family="monospace" font-size="11">MCP client</text>
  <text x="222" y="94" fill="#9a9a9a" font-family="monospace" font-size="10">stdio / SSE</text>
  <path d="M360 80h36" stroke="#00e5ff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="396" y="40" width="130" height="40" fill="none" stroke="#7fff00" stroke-width="1.5"/>
  <text x="408" y="64" fill="#7fff00" font-family="monospace" font-size="10">tools</text>
  <rect x="396" y="88" width="130" height="40" fill="none" stroke="#f5c518" stroke-width="1.5"/>
  <text x="408" y="112" fill="#f5c518" font-family="monospace" font-size="10">resources</text>
  <rect x="536" y="40" width="160" height="88" fill="none" stroke="#7fff00" stroke-width="2"/>
  <text x="548" y="64" fill="#fff" font-family="monospace" font-size="11">MCP servers</text>
  <text x="548" y="82" fill="#9a9a9a" font-family="monospace" font-size="9">git / db / browser</text>
  <text x="548" y="98" fill="#9a9a9a" font-family="monospace" font-size="9">filesystem / APIs</text>
  <rect x="24" y="150" width="672" height="120" fill="none" stroke="#333" stroke-dasharray="5 4"/>
