  <text x="264" y="212" fill="#f5c518" font-family="monospace" font-size="10">tool schema surface</text>
  <rect x="468" y="190" width="210" height="36" fill="none" stroke="#00e5ff"/>
  <text x="480" y="212" fill="#00e5ff" font-family="monospace" font-size="10">human approval gate</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
