<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="brutalist" data-theme="red">

  <div id="siteUnderlayStack" class="site-underlay-stack" aria-hidden="true"></div>

  <header class="hn-bar">
    <h1 class="hn-title"><a href="../index.html" class="glitch" data-text="abhinavall.net">abhinavall.net</a></h1>
    <nav class="hn-tabs" aria-label="Site">
      <a href="../index.html" class="hn-tab">Map</a>
      <a href="../projects.html" class="hn-tab">List</a>
      <span class="hn-sep">|</span>
      <a href="../connect.html">connect</a>
      <a href="../projects.html">top</a>
      <a href="../experience.html">jobs</a>
      <a href="../blog/index.html">blog</a>
      <a href="../connect.html#contact">ask</a>
    </nav>
    <div class="hn-utilities" aria-label="Header utilities">
      <button type="button" class="resume-pill" id="header-resume" aria-label="Resume downloads">
        <span class="resume-pill__icon" aria-hidden="true">▦</span>
        <span class="resume-pill__label">Resume</span>
        <span class="resume-pill__dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="mode-toggle" id="mode-toggle" aria-label="Switch to calm mode" aria-pressed="false" title="Toggle kinetic / calm">
        <img class="mode-toggle__icon mode-toggle__icon--kinetic" src="../images/mode-chevron.svg" alt="" width="20" height="20" aria-hidden="true">
        <img class="mode-toggle__icon mode-toggle__icon--calm" src="../images/mode-zzz.svg" alt="" width="20" height="20" aria-hidden="true">
      </button>
    </div>
  </header>

  <main class="mail-main">
    <div class="container">
      <div class="mail-header section-header">
        <p class="section-label">// Inbox</p>
        <h1 class="section-title">Portfolio mail</h1>
        <p class="mail-address">abhinav.allam@abhinavall.net</p>
      </div>

      <div id="mail-error" class="mail-error" hidden></div>

      <div class="mail-toolbar">
        <button type="button" class="mail-refresh" id="mail-refresh">Refresh</button>
        <span class="mail-status" id="mail-status" aria-live="polite"></span>
      </div>

      <div class="mail-layout">
        <div class="mail-list" id="mail-list" aria-label="Message list"></div>
        <article class="mail-detail" id="mail-detail" aria-label="Message detail">
          <p class="mail-detail__empty">Select a message to read.</p>
        </article>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Abhinav Allam — Inbox is owner-only (Cloudflare Access)</p>
      <a href="#" class="back-to-top" id="back-to-top">↑ Back to top</a>
