[package]
name = "infranet"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "infranet-node"
path = "src/bin/node.rs"

[[bin]]
name = "infranet-test"
path = "src/bin/test_runner.rs"




